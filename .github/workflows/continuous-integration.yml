name: Continuous Integration

on: push

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
        env:
          CI: true
